name: android-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper JAR is intentionally not committed (sandbox cannot
      # run `gradle wrapper` locally) — install the CLI once, generate the
      # wrapper, then drive every later step through ./gradlew so the
      # dependency cache applies.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Unit tests (JVM)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # armv7a-only: the user's TV box is 32-bit ARM. One signed APK per
      # build — fast CI, small artifact. Other ABIs: build locally with
      # -Pcinedrive.abiList=<list> (default is the full set).
      - name: Assemble debug APK (armeabi-v7a)
        run: ./gradlew :app:assembleDebug -Pcinedrive.abiList=armeabi-v7a --stacktrace

      # Signed with keystore/cinedrive-release.keystore (committed, private
      # repo). Signature stays constant across runs, so new builds install
      # OVER old ones without wiping the library / watch progress.
      - name: Assemble release APK (signed, armeabi-v7a)
        run: ./gradlew :app:assembleRelease -Pcinedrive.abiList=armeabi-v7a --stacktrace

      - name: Verify release APK is signed
        run: |
          UNSIGNED=$(find app/build/outputs/apk -name "*-unsigned.apk" | wc -l)
          if [ "$UNSIGNED" -ne 0 ]; then
            echo "::error::$UNSIGNED unsigned APK(s) produced - signing config failed"
            exit 1
          fi
          echo "Signed release APK:"
          find app/build/outputs/apk -name "*-release.apk" -exec ls -lh {} \;

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cinedrive-debug-apks
          path: app/build/outputs/apk/debug/**/app-*.apk
          if-no-files-found: error

      - name: Upload release APKs (signed)
        uses: actions/upload-artifact@v4
        with:
          name: cinedrive-release-apks
          path: app/build/outputs/apk/release/**/app-*-release.apk
          if-no-files-found: error

      # Room schema JSON (migration baseline). Step 4 added cross-volume
      # queries only — no schema change — but the JSON should be archived
      # from every build from now on (worklog task 3.1 follow-up).
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Job summary — APK for the armv7a box
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## CineDrive release APK (signed, armeabi-v7a)

          **Install on your armv7a TV box → `app-armeabi-v7a-release.apk`**

          Copy to USB → allow *Unknown sources* for your file manager
          (Settings → Device Preferences → Security & Restrictions — no root)
          → open the APK. Updates install over the previous build; the
          library and watch progress are preserved.
          EOF
