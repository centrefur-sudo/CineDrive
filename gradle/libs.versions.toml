# ─────────────────────────────────────────────────────────────────────────────
# CineDrive version catalog — single source of truth for every dependency.
#
# Version policy: stable, mutually-verified lines only.
#   • AGP 8.10.1  ↔ Gradle 8.11.1+  ↔ JDK 17   (verified compatibility pair)
#   • Kotlin 2.0.21 ↔ KSP 2.0.21-1.0.28        (last KSP1 build for 2.0.x,
#                                                verified on Maven Central)
#   • libvlc-all 3.7.7                          (latest stable, Maven Central)
#   • androidx.tv:tv-material 1.0.1             (latest stable of Compose for TV)
#
# AGP 9.x exists but requires Gradle 9.5 + KGP 2.2.10 + KSP2 migration —
# no benefit for this feature set, deliberately not used.
# ─────────────────────────────────────────────────────────────────────────────

[versions]
# Build tooling
agp = "8.10.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# Compose
composeBom = "2024.12.01"
tvMaterial = "1.0.1"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
lifecycle = "2.8.7"

# AndroidX core
coreKtx = "1.15.0"
documentfile = "1.0.1"

# Dependency injection
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# Persistence
room = "2.6.1"
datastore = "1.1.1"

# Playback engine
libvlc = "3.7.7"

# Async / images
coroutines = "1.9.0"
coil = "2.7.0"

# Testing
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# --- AndroidX core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# --- Compose (versions supplied by the BOM) ---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Compose for TV (Material TV surfaces, focusable cards, sidebars) ---
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

# --- Lifecycle / ViewModel / Navigation ---
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# --- Hilt ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Room ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# --- DataStore (app settings: subtitle prefs, default audio language, ...) ---
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Playback engine: full-codec LibVLC (MKV/DTS/AC3/PGS out of the box) ---
libvlc = { group = "org.videolan.android", name = "libvlc-all", version.ref = "libvlc" }

# --- Coroutines ---
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Images (poster.jpg / fanart.jpg / cover.jpg loading) ---
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# --- Testing ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
